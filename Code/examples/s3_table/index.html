<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>s3_table</title>
</head>
<body>
  <style>
    table{border-collapse:collapse}
    th,td{border:1px solid #999;padding:6px 10px}
    caption{font-weight:bold;margin-bottom:6px}
  </style>
  
  <table>
    <caption>Drink prices</caption>
    <thead>
      <tr><th scope="col">Drink</th><th scope="col">Small</th><th scope="col">Large</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">Iced coffee</th><td>$1.50</td><td>$2.00</td></tr>
      <tr><th scope="row">Green tea</th><td>$1.25</td><td>$1.75</td></tr>
    </tbody>
  </table>
</body>
</html>
